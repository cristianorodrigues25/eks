apiVersion: v1
kind: Service
metadata:
  name: laravel-app
  namespace: default
  labels:
    app: laravel
  annotations:
    # Annotations para AWS Load Balancer Controller
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: laravel
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: None

---
# Service interno para comunicação entre pods
apiVersion: v1
kind: Service
metadata:
  name: laravel-app-internal
  namespace: default
  labels:
    app: laravel
spec:
  type: ClusterIP
  selector:
    app: laravel
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800