apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: default
  labels:
    app: laravel
data:
  # Configurações da aplicação
  APP_NAME: "Laravel EKS App"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://laravel-app.exemplo.com"

  # Configurações de log
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "error"

  # Configurações de cache e sessão
  CACHE_DRIVER: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  QUEUE_CONNECTION: "redis"

  # Configurações de database
  DB_CONNECTION: "mysql"
  DB_PORT: "3306"

  # Configurações de Redis
  REDIS_CLIENT: "phpredis"
  REDIS_PORT: "6379"

  # Configurações de mail
  MAIL_MAILER: "smtp"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"

  # Configurações de broadcast
  BROADCAST_DRIVER: "log"

  # Configurações de filesystem
  FILESYSTEM_DRIVER: "local"

  # Timezone
  TIMEZONE: "UTC"

  # Configurações customizadas para observabilidade
  METRICS_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"

  # PHP-FPM configuration
  php-fpm.conf: |
    [global]
    error_log = /proc/self/fd/2
    daemonize = no

    [www]
    listen = 9000
    pm = dynamic
    pm.max_children = 50
    pm.start_servers = 5
    pm.min_spare_servers = 5
    pm.max_spare_servers = 35
    pm.max_requests = 500

    clear_env = no

    catch_workers_output = yes
    decorate_workers_output = no

  # NGINX configuration override (opcional)
  nginx-site.conf: |
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/html/public;
        index index.php index.html;

        server_name _;

        charset utf-8;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Buffer settings
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;

            # Timeouts
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Health check endpoints
        location ~ ^/(health|ready|live|metrics)$ {
            access_log off;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }