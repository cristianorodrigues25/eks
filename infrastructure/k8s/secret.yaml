apiVersion: v1
kind: Secret
metadata:
  name: laravel-secrets
  namespace: default
  labels:
    app: laravel
type: Opaque
stringData:
  # IMPORTANTE: Em produção, usar External Secrets Operator ou AWS Secrets Manager
  # Estes valores são apenas exemplos - NÃO commitar valores reais no git!

  # Chave da aplicação (gerar com: php artisan key:generate --show)
  app-key: "base64:YourGeneratedAppKeyHere="

  # Credenciais do banco de dados
  db-host: "your-rds-endpoint.amazonaws.com"
  db-database: "laravel"
  db-username: "admin"
  db-password: "ChangeMeToSecurePassword"

  # Credenciais do Redis
  redis-host: "your-redis-endpoint.amazonaws.com"
  redis-password: "ChangeMeToSecureRedisPassword"

  # Credenciais de email
  mail-host: "smtp.mailgun.org"
  mail-username: "your-mail-username"
  mail-password: "your-mail-password"
  mail-from-address: "noreply@exemplo.com"
  mail-from-name: "Laravel App"

---
# Service Account para IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laravel-app
  namespace: default
  labels:
    app: laravel
  annotations:
    # Substituir com o ARN da role IAM criada para a aplicação
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/laravel-app-role

---
# External Secrets (Recomendado para produção)
# Instalar o External Secrets Operator primeiro:
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretstore
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: laravel-app

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: laravel-secrets-external
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: laravel-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: laravel-eks-cluster-rds-credentials
  - extract:
      key: laravel-eks-cluster-redis-credentials
  data:
  - secretKey: app-key
    remoteRef:
      key: laravel-app-key
      property: key