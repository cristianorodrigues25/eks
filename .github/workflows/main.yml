name: CI/CD Pipeline

on:
  pull_request:
    types: [ closed ]
    branches: [ staging, main ]

env:
  PHP_VERSION: '8.3'
  AWS_REGION: us-east-2
  ECR_REPOSITORY: laravel-eks-app
  AWS_ACCOUNT_ID: '120346103284'

permissions:
  id-token: write   # Necessário para OIDC
  contents: read    # Necessário para checkout
  security-events: write  # Para upload SARIF

jobs:
  # ===========================================
  # Tarefa 1: Testes e Análise de Código
  # ===========================================
  test:
    name: 🧪 Testes e Análise
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, pdo_mysql, redis
          coverage: xdebug

      - name: 📦 Cache de dependências Composer
        uses: actions/cache@v3
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📚 Instalar dependências
        working-directory: ./src
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          cp .env.example .env
          php artisan key:generate

      - name: 🗄️ Preparar banco de dados
        working-directory: ./src
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: 🧪 Executar testes PHPUnit
        working-directory: ./src
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

      - name: 🎨 Verificar código com Laravel Pint
        working-directory: ./src
        run: ./vendor/bin/pint --test

  # ===========================================
  # Tarefa 2: Build e Push da Imagem Docker
  # ===========================================
  build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Configurar AWS CLI (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-eks-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Preparar metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build e Push para ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

  # ===========================================
  # Tarefa 3: Análise de Segurança
  # ===========================================
  security:
    name: 🔒 Análise de Segurança
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Configurar AWS CLI (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-eks-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔍 Scan com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 🛡️ Análise de dependências PHP
        working-directory: ./src
        run: |
          composer audit

  # ===========================================
  # Tarefa 4: Deploy no EKS
  # ===========================================
  deploy:
    name: 🚀 Deploy EKS
    runs-on: ubuntu-latest
    needs: [build, security]
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging' &&
      github.event.pull_request.head.ref == 'develop'
    environment:
      name: staging
      url: https://devops.natiwo.dev.br

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Configurar AWS CLI (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-eks-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📦 Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig --name laravel-eks --region ${{ env.AWS_REGION }}

      - name: 🚀 Deploy no Kubernetes
        run: |
          kubectl set image deployment/laravel-app \
            laravel-app=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -n default
          kubectl rollout status deployment/laravel-app -n default --timeout=300s

